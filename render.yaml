# Hosted demo: a static site (Render static runtime never sleeps,
# unlike the previous Python web service — this is why it now loads
# instantly instead of ~60s after idle).
#
# The build renders the real Jinja template and bakes in sample data;
# demo/demo-mode.js mocks the API in-browser, so writes reset on reload.
services:
  - type: web
    name: mistraker-demo
    runtime: static
    buildCommand: pip install flask && python build_demo.py
    staticPublishPath: ./dist-demo
